<section id="contact">
  <div class="rv">
    <div class="mono">Contact</div>
    <h2 style="margin: 16px 0">Start with <em>the problem.</em></h2>
    <p>
      You do not need to know which service you need. Start with the
      objective, the uncertainty or the thing that is not working.
    </p>
    <form id="cf">
      <input name="name" placeholder="Name" required />
      <input name="email" type="email" placeholder="Email" required />
      <input name="org" placeholder="Organization" />
      <textarea
        name="msg"
        placeholder="What is the objective, or the thing not working?"
        required
      ></textarea>
      <input class="hp" name="website" tabindex="-1" autocomplete="off" />
      <button class="btn" type="submit">Send ↗</button>
      <p id="ok" hidden style="color: var(--signal)">
        Opening your email app. Thank you.
      </p>
    </form>
  </div>
</section>
